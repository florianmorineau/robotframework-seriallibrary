name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        robotframework: ["7.0", "7.*"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[dev] "robotframework==${{ matrix.robotframework }}"
      - run: ruff check src tests
      - run: robocop check tests
      - run: pytest
      - run: robot --outputdir results tests/acceptance
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: results-py${{ matrix.python }}-rf${{ matrix.robotframework }}
          path: results
